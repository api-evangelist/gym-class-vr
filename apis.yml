aid: gym-class-vr
name: Gym Class VR
description: >-
  Gym Class VR (operating as "Gym Class" by IRL Studios) is a social virtual
  reality sports gaming platform for Meta Quest headsets and mobile devices,
  offering multiplayer basketball, baseball, football, boxing, paintball, and
  soccer experiences where players compete, socialize, and create and share
  their own games. The top-rated sports title on the Meta Quest Store with a
  4.8-star average across 53,000+ ratings, the company holds licensing
  agreements with the NBA and Major League Baseball, expanded to mobile in 2026,
  and has raised over $8M from Andreessen Horowitz (a16z), Y Combinator, and NBA
  players. It is a consumer VR entertainment product with no public developer
  API, SDK, or developer portal at this time.
